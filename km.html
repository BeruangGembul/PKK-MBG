<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antrean MBG - KM</title>
    <link rel="stylesheet" href="murid.css">
    
    <!-- CSS Tambahan Khusus untuk Animasi Dropdown -->
    <style>
        .custom-select-wrapper {
            position: relative;
            user-select: none;
            width: 100%;
            margin-top: 8px;
            margin-bottom: 20px;
        }

        .custom-select {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .custom-select__trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            height: 45px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .custom-select__trigger:hover {
            border-color: #4a76a8;
        }

        .arrow {
            position: relative;
            height: 10px;
            width: 10px;
        }
        
        .arrow::before, .arrow::after {
            content: "";
            position: absolute;
            bottom: 0;
            width: 2px;
            height: 100%;
            transition: all 0.3s ease;
            background-color: #666;
        }
        
        .arrow::before { left: -3px; transform: rotate(45deg); }
        .arrow::after { left: 3px; transform: rotate(-45deg); }
        .custom-select.open .arrow::before { transform: rotate(-45deg); }
        .custom-select.open .arrow::after { transform: rotate(45deg); }

        .custom-options {
            position: absolute;
            display: block;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-top: 8px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(-15px);
            transition: all 0.3s ease;
            max-height: 250px;
            overflow-y: auto;
            z-index: 999;
        }

        .custom-select.open .custom-options {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
            transform: translateY(0);
        }

        .custom-option {
            position: relative;
            display: block;
            padding: 12px 15px;
            font-size: 14px;
            color: #444;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .custom-option:hover {
            background-color: #e9f0f8;
            color: #4a76a8;
        }

        .custom-option.selected {
            background-color: #4a76a8;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="title-container">
        <h2 class="title-text">Antrean MBG Sekolah</h2>
        <span class="btn-antrean-mini" onclick="window.bukaModalAntrean()" title="Lihat Urutan Antrean">
            📋 List Antrian

    </div>
    
    <div id="formSection">
        <label for="kelas" style="color: #d4dce5; font-size: 14px;">Pilih Kelas Anda:</label>
        
        <!-- Select bawaan ini akan otomatis diubah menjadi dropdown animasi oleh JavaScript di bawah -->
        <select id="kelas">

            <!--KELAS X-->

            <option value="XI OI 2">XI OI 2</option>
            <option value="XI MEKA 1">XI MEKA 1</option>
            <option value="XI MEKA 2">XI MEKA 2</option>
            <option value="XI LAS 1">XI LAS 1</option>

            <option value="XI MESIN 2">XI MESIN 2</option>

            <option value="XI TKR 2">XI TKR 2</option>
            <option value="XI DGM 1">XI DGM 1</option>
            <option value="XI DGM 2">XI DGM 2</option>
            <option value="XI RPL 1">XI RPL 1</option>

            <!--KELAS XII-->
            <option value="XII ELIND 1">XII ELIND 1</option>

            <option value="XII LAS 1">XII LAS 1</option>

            <option value="XII MESIN 1">XII MESIN 1</option>
            <option value="XII MESIN 2">XI MESIN 2</option>
            <option value="XII TKR 1">XII TKR 1</option>
            <option value="XII TKR 2">XII TKR 2</option>
            <option value="XII DGM 1">XII DGM 1</option>
            <option value="XII DGM 2">XII DGM 2</option>
            <option value="XII RPL 1">XII RPL 1</option>
            <option value="XII RPL 2">XII RPL 2</option>
            <option value="XII RPL 3">XII RPL 3</option>

        </select>
        
        <button onclick="ambilAntrean()">Ambil Nomor Antrean</button>
    </div>

    <div class="status-box status-menunggu" id="statusBox" style="display:none;">
        <div class="status-title">Status Antrean Kelas <span id="namaKelasLabel">-</span></div>
        <div class="status-text" id="statusAntreanText">MENUNGGU...</div>
        <p id="instruksiText" style="margin: 0; font-size: 14px;">Harap tunggu di kelas sampai giliran dipanggil.</p>

        <button id="btnReset" onclick="window.resetAntrean()" style="margin-top: 15px; background: #64748b; display: none; border: none; padding: 12px 16px; border-radius: 8px; color: white; cursor: pointer; width: 100%; font-weight: bold;">
    🔄 Ambil Antrian Baru 
</button>
    </div>

<!-- SIDEBAR / PANEL SAMPING ANTREAN -->
<div id="modalAntrean" class="sidebar-overlay hidden" onclick="window.tutupModalAntrean()">
    <div class="sidebar-card">
        <div class="sidebar-header">
            <h3>Urutan Antrean MBG</h3>
            <button type="button" class="btn-close" onclick="window.tutupModalAntrean(); event.stopPropagation();">&times;</button>
        </div>
        <div class="sidebar-body" onclick="event.stopPropagation()">
            <table class="antrean-table">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Kelas</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabelAntreanBody">
                    <tr><td colspan="3" style="text-align:center;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue,update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    window.kembalikanWadah = function () {
        const savedKey = localStorage.getItem('myAntreanKey');
        const savedDate = localStorage.getItem('myAntreanDate') || getTanggalHariIni();
        if (!savedKey) return;

    // Ambil jam & menit saat ini (format HH:MM WIB)
        const sekarang = new Date();
        const jamFormat = sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + " WIB";

        const spesifikRef = ref(db, `antrean/${savedDate}/${savedKey}`);

    // Update status pengembalian di Firebase
        update(spesifikRef, {
        statusPengembalian: "dikembalikan",
        waktuKembali: jamFormat
        }).then(() => {
        alert("Wadah MBG berhasil dicatat telah dikembalikan pada jam " + jamFormat);
        }).catch((error) => {
        alert("Gagal mencatat pengembalian: " + error.message);
        });
    }

    const firebaseConfig = {
        apiKey: "AIzaSyBl-m0uLNkWyFFQAd9ho7yYTcsX6z9KIMk",
        authDomain: "mbg-pkk.firebaseapp.com",
        databaseURL: "https://mbg-pkk-default-rtdb.firebaseio.com",
        projectId: "mbg-pkk",
        storageBucket: "mbg-pkk.firebasestorage.app",
        messagingSenderId: "752541102453",
        appId: "1:752541102453:web:38047f08514042a137233c",
        measurementId: "G-JFCTHZZDRQ"
    };

    

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const auth = getAuth(app);
    signInAnonymously(auth).catch((err) => console.error("Gagal Auth Anonim KM:", err));

    let daftarAntreanGlobal = [];
    let myKelasGlobal = "";

    window.bukaModalAntrean = function() {
        const modal = document.getElementById("modalAntrean");
        if (modal) {
            renderTabelAntrean();

            modal.classList.remove("hidden");

            setTimeout(() => {

            modal.classList.add("tampil-animasi");
        }, 10);
        } else {
            console.error("Elemen #modalAntrean tidak ditemukan di HTML!");
        }
    };

    window.tutupModalAntrean = function() {
        const modal = document.getElementById("modalAntrean");

        if (modal) {
        modal.classList.remove("tampil-animasi");

        setTimeout(() => {
            modal.classList.add("hidden");
        }, 300); 
    }// 300ms sama dengan durasi 0.3s di CSS
    };

    // 1. Cek status antrean saat halaman dimuat
    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('myAntreanKey');
        const savedKelas = localStorage.getItem('myKelas');
        const savedDate = localStorage.getItem('myAntreanDate');
        const hariIni = getTanggalHariIni();

        if (savedDate && savedDate !== hariIni) {
            localStorage.removeItem('myAntreanKey');
            localStorage.removeItem('myAntreanDate');
            localStorage.removeItem('mykelas');
            window.location.reload();
            return;
        }


        if (savedKey && savedKelas) {
            myKelasGlobal = savedKelas;
            tampilkanStatusBox(savedKelas);
            pantauStatus(savedKey,hariIni);
        }

        pantauSeluruhAntrean();
    });

    function getTanggalHariIni(){
        const d = new Date();
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()) .padStart(2,'0');
        return `${year}-${month}-${day}`;
}
        const hariIni = getTanggalHariIni();
        const savedKey = localStorage.getItem('myAntreanKey');
        if (savedKey) {
    const spesifikRef = ref(db, "antrean/" + hariIni + "/" + savedKey);

        }
        
    // 2. FUNGSI AMBIL ANTREAN (Dipasang ke window agar onclick HTML bisa panggil)
    window.ambilAntrean = function() {
        const kelasSelect = document.getElementById("kelas");
        const kelas = kelasSelect ? kelasSelect.value : "";

        if (!kelas) {
            alert("Pilih kelas terlebih dahulu!");
            return;
        }

        myKelasGlobal = kelas;
        const tanggal = getTanggalHariIni();
        const antreanRef = ref(db, "antrean/" + tanggal);

        // Simpan data ke Firebase
        const newAntreanRef = push(antreanRef, {
            kelas: kelas,
            status: "menunggu",
            waktu: Date.now(),
            statusPengembalian:"belum",
            waktuKembali:"-"
        });

        const newKey = newAntreanRef.key;

        // Simpan key & kelas ke LocalStorage
        localStorage.setItem('myAntreanKey', newKey);
        localStorage.setItem('myAntreanDate',tanggal);
        localStorage.setItem('myKelas', kelas);

        tampilkanStatusBox(kelas);
        pantauStatus(newKey,tanggal);
    };

    // 3. FUNGSI RESET ANTREAN (Dipasang ke window agar onclick HTML bisa panggil)
    window.resetAntrean = function() {
        localStorage.removeItem('myAntreanKey');
        localStorage.removeItem('myKelas');
        
        // Reload halaman agar kembali bersih ke form awal
        window.location.reload();
    };

    // Helper Tampilan
    function tampilkanStatusBox(kelas) {
        document.getElementById("formSection").style.display = "none";
        document.getElementById("statusBox").style.display = "block";
        document.getElementById("namaKelasLabel").innerText = kelas;
    }

    // 4. Pantau Status Antrean secara Real-Time
    function pantauStatus(key,tanggal) {
        const tgl = tanggal || getTanggalHariIni();
        const spesifikRef = ref(db, "antrean/" + tgl + "/" + key);

        onValue(spesifikRef, (snapshot) => {
            const data = snapshot.val();
            
            if (!data) {
                window.resetAntrean();
                return;
            }

            const box = document.getElementById("statusBox");
            const text = document.getElementById("statusAntreanText");
            const instruksi = document.getElementById("instruksiText");
            const btnReset = document.getElementById("btnReset");

            if(!box || !text || !instruksi) return;

            if (data.status === 'menunggu') {
                box.className = "status-box status-menunggu";
                text.innerText = "MENUNGGU...";
                instruksi.innerText = "Harap tunggu di kelas sampai giliran dipanggil.";
                if (btnReset) btnReset.style.display = "none";
                hapusTombolKembali(); 

            } else if (data.status === 'dipanggil') {
                box.className = "status-box status-dipanggil";
                text.innerText = "SILAKAN AMBIL!";
                instruksi.innerText = "🚨 Giliran kelasmu! Segera menuju tempat pembagian MBG.";

                if (btnReset) btnReset.style.display = "none";
                hapusTombolKembali(); 

                const bel = document.getElementById("suaraBel");
                if(bel) {
                    bel.play().catch(e => console.log("Audio diblokir browser, interaksi user diperlukan."));
                }

                if (!Swal.isVisible()) {
                    Swal.fire({
                        title: 'GILIRAN KELAS KAMU!',
                        text: `Silakan menuju ruang MBG sekarang.`,
                        icon: 'info',
                        confirmButtonText: 'Oke, Saya Menuju Kesana',
                        confirmButtonColor: '#10b981',
                        allowOutsideClick: false
                    });
                }

            } else if (data.status === 'selesai') {
                box.className = "status-box status-selesai";
        
                if (data.statusPengembalian === 'dikembalikan') {
                    text.innerText = "WADAH DIKEMBALIKAN";
                    instruksi.innerText = `Terima kasih! Wadah MBG telah dikembalikan pada jam ${data.waktuKembali}.`;
            
                    if (btnReset) btnReset.style.display = "block";
                    hapusTombolKembali();
                } else {
                    text.innerText = "MAKANAN SELESAI";
                    instruksi.innerText = "Silakan nikmati makanan. Jangan lupa kembalikan tempat MBG jika sudah selesai!";
            
                    buatTombolKembali();
                    if (btnReset) btnReset.style.display = "none";
                }
            }
        });
    }
    


    function buatTombolKembali() {
    if (!document.getElementById("btnKembaliWadah")) {
        const box = document.getElementById("statusBox");
        const btn = document.createElement("button");
        btn.id = "btnKembaliWadah";
        btn.innerText = "🍱 Kembalikan Tempat MBG";
        btn.style.cssText = "margin-top: 15px; background-color: #10b981; color: white; border: none; padding: 12px 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 14px;";
        
        btn.addEventListener('click', () => {
            window.kembalikanWadah();
        });

        box.appendChild(btn);
    }
    }

    function hapusTombolKembali() {
        const btn = document.getElementById("btnKembaliWadah");
        if (btn) btn.remove();
    }
    // Fungsi membuat tombol "Ambil Antrean Baru"
    function buatTombolReset() {
        if (!document.getElementById("btnReset")) {
            const box = document.getElementById("statusBox");
            const btn = document.createElement("button");
            btn.id = "btnReset";
            btn.innerText = "🔄 Ambil Antrean Baru / Berikutnya";
            btn.style.cssText = "margin-top: 15px; background-color: #2563eb; color: white; border: none; padding: 12px 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 14px;";
            
            // Pasang fungsi reset langsung ke Event Listener
            btn.addEventListener('click', () => {
                window.resetAntrean();
            });

            box.appendChild(btn);
        }
    }

    function hapusTombolReset() {
        const btn = document.getElementById("btnReset");
        if (btn) btn.remove();
    }

    function pantauSeluruhAntrean() {
        const hariIni = getTanggalHariIni();
        const antreanRef = ref(db, `antrean/${hariIni}`);

        onValue(antreanRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                daftarAntreanGlobal = Object.keys(data).map(key => ({
                    key: key,
                    ...data[key]
                })).sort((a, b) => a.waktu - b.waktu);

                const modal = document.getElementById("modalAntrean");
                if (modal && !modal.classList.contains("hidden")) {
                    renderTabelAntrean();
                }
            } else {
                daftarAntreanGlobal = [];
                renderTabelAntrean();
            }
        });
    }

    

    function renderTabelAntrean(){
        const tbody = document.getElementById("tabelAntreanBody");
        if (!tbody) return;
            
        tbody.innerHTML = "";

        // Perbaikan logika: jika array kosong
        if (daftarAntreanGlobal.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#64748b;">Belum ada antrean hari ini</td></tr>';
            return;
        }

        // Perbaikan variabel index, isMyClass, dan "dipanggil"
        daftarAntreanGlobal.forEach((item, index) => {
            const tr = document.createElement("tr");

            const isMyClass = (item.kelas === myKelasGlobal);
            if (isMyClass) tr.classList.add("my-class-row");
            
            let badgeClass = "badge-menunggu";
            if (item.status === "selesai") badgeClass = "badge-selesai";
            if (item.status === "dipanggil") badgeClass = "badge-dipanggil";

            tr.innerHTML = `
    <td>#${index + 1}</td>
    <td><strong>${item.kelas} ${isMyClass ? '⭐ (Kelas Anda)' : ''}</strong></td>
    <td>
        <span class="badge ${badgeClass}">${item.status || 'menunggu'}</span>
        ${item.statusPengembalian === 'dikembalikan' ? `<br><small style="color:#10b981; font-size: 11px;">✅ Wadah Kembali (${item.waktuKembali})</small>` : ''}
    </td>
`;

            tbody.appendChild(tr);
        });
        
    }

    document.addEventListener("DOMContentLoaded", function() {
        const originalSelect = document.getElementById("kelas");
        
        // Sembunyikan select bawaan HTML
        originalSelect.style.display = "none";

        // Buat struktur pembungkus custom
        const wrapper = document.createElement("div");
        wrapper.className = "custom-select-wrapper";
        originalSelect.parentNode.insertBefore(wrapper, originalSelect);
        wrapper.appendChild(originalSelect); // Pindahkan original select ke dalam wrapper

        // Buat elemen visual untuk dropdown
        const customSelect = document.createElement("div");
        customSelect.className = "custom-select";

        const trigger = document.createElement("div");
        trigger.className = "custom-select__trigger";
        
        const triggerText = document.createElement("span");
        triggerText.className = "trigger-text";
        triggerText.textContent = "Pilih Kelas...";
        
        const arrow = document.createElement("div");
        arrow.className = "arrow";

        trigger.appendChild(triggerText);
        trigger.appendChild(arrow);
        customSelect.appendChild(trigger);

        const optionsContainer = document.createElement("div");
        optionsContainer.className = "custom-options";

        // Ambil data dari select bawaan Anda dan buat jadi daftar beranimasi
        Array.from(originalSelect.options).forEach(opt => {
            if (opt.value === "") return; // Lewati opsi kosong ("Pilih kelas...")

            const customOption = document.createElement("span");
            customOption.className = "custom-option";
            customOption.setAttribute("data-value", opt.value);
            customOption.textContent = opt.textContent;

            // Saat diklik
            customOption.addEventListener("click", function() {
                // Hapus warna dari semua opsi lain
                optionsContainer.querySelectorAll(".custom-option").forEach(o => o.classList.remove("selected"));
                // Warnai opsi yang diklik
                this.classList.add("selected");
                
                // Ubah teks yang tampil
                triggerText.textContent = this.textContent;
                
                // PENTING: Setel value ke elemen <select> asli agar fungsi ambilAntrean() Anda tetap berjalan normal!
                originalSelect.value = this.getAttribute("data-value");
                
                // Tutup dropdown
                customSelect.classList.remove("open");
            });

            optionsContainer.appendChild(customOption);
        });

        customSelect.appendChild(optionsContainer);
        wrapper.appendChild(customSelect);

        // Buka/tutup dropdown saat ditekan
        trigger.addEventListener("click", function(e) {
            customSelect.classList.toggle("open");
            e.stopPropagation();
        });

        // Tutup otomatis jika pengguna mengklik area di luar kotak dropdown
        window.addEventListener("click", function(e) {
            if (!wrapper.contains(e.target)) {
                customSelect.classList.remove("open");
            }
        });
    });
        
</script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<audio id="suaraBel" src="audi/pop.mp3" preload="auto"></audio>
</body>
