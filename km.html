<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antrean MBG - KM</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

<div class="card">
    <div class="title-container">
        <h2 class="title-text">Antrean MBG Sekolah</h2>
        <span class="btn-antrean-mini" onclick="window.bukaModalAntrean()" title="Lihat Urutan Antrean">
            📋 List Antrian
        </span>
    </div>
    
    <div id="formSection">
        <label for="kelas" style="color: #64748b; font-size: 14px;">Pilih Kelas Anda:</label>
        <select id="kelas">
            <!--KELAS X-->
            <option value="X ELIND 1">X ELIND 1</option>
            <option value="X ELIND 2">X ELIND 2</option>
            <option value="X OI 1">X OI 1</option>
            <option value="X OI 2">X OI 2</option>
            <option value="X MEKA 1">X MEKA 1</option>
            <option value="X MEKA 2">X MEKA 2</option>
            <option value="X LAS 1">X LAS 1</option>
            <option value="X LAS 2">X LAS 2</option>
            <option value="X MESIN 1">X MESIN 1</option>
            <option value="X MESIN 2">X MESIN 2</option>
            <option value="X TKR 1">X TKR 1</option>
            <option value="X TKR 2">X TKR 2</option>
            <option value="X DGM 1">X DGM 1</option>
            <option value="X DGM 2">X DGM 2</option>
            <option value="X RPL 1">X RPL 1</option>
            <option value="X RPL 2">X RPL 2</option>
            <option value="X RPL 3">X RPL 3</option>
            <option value="X RPL 4">X RPL 4</option>
            <!--KELAS XI-->
            <option value="XI ELIND 1">XI ELIND 1</option>
            <option value="XI ELIND 2">XI ELIND 2</option>
            <option value="XI OI 1">XI OI 1</option>
            <option value="XI OI 2">XI OI 2</option>
            <option value="XI MEKA 1">XI MEKA 1</option>
            <option value="XI MEKA 2">XI MEKA 2</option>
            <option value="XI LAS 1">XI LAS 1</option>
            <option value="XI LAS 2">XI LAS 2</option>
            <option value="XI MESIN 1">XI MESIN 1</option>
            <option value="XI MESIN 2">XI MESIN 2</option>
            <option value="XI TKR 1">XI TKR 1</option>
            <option value="XI TKR 2">XI TKR 2</option>
            <option value="XI DGM 1">XI DGM 1</option>
            <option value="XI DGM 2">XI DGM 2</option>
            <option value="XI RPL 1">XI RPL 1</option>
            <option value="XI RPL 2">XI RPL 2</option>
            <option value="XI RPL 3">XI RPL 3</option>
            <option value="XI RPL 4">XI RPL 4</option>
            <!--KELAS XII-->
            <option value="XII ELIND 1">XII ELIND 1</option>
            <option value="XII ELIND 2">XII ELIND 2</option>
            <option value="XII OI 1">XII OI 1</option>
            <option value="XII OI 2">XII OI 2</option>
            <option value="XII MEKA 1">XII MEKA 1</option>
            <option value="XII MEKA 2">XII MEKA 2</option>
            <option value="XII LAS 1">XII LAS 1</option>
            <option value="XII LAS 2">XII LAS 2</option>
            <option value="XII MESIN 1">XII MESIN 1</option>
            <option value="XII MESIN 2">XI MESIN 2</option>
            <option value="XII TKR 1">XII TKR 1</option>
            <option value="XII TKR 2">XII TKR 2</option>
            <option value="XII DGM 1">XII DGM 1</option>
            <option value="XII DGM 2">XII DGM 2</option>
            <option value="XII RPL 1">XII RPL 1</option>
            <option value="XII RPL 2">XII RPL 2</option>
            <option value="XII RPL 3">XII RPL 3</option>
            <option value="XII RPL 4">XII RPL 4</option>
        </select>
        <button onclick="ambilAntrean()">Ambil Nomor Antrean</button>
    </div>

    <div class="status-box status-menunggu" id="statusBox" style="display:none;">
        <div class="status-title">Status Antrean Kelas <span id="namaKelasLabel">-</span></div>
        <div class="status-text" id="statusAntreanText">MENUNGGU...</div>
        <p id="instruksiText" style="margin: 0; font-size: 14px;">Harap tunggu di kelas sampai giliran dipanggil.</p>

        

        <button id="btnReset" onclick="resetAntrean()" style="margin-top: 15px; background: #64748b; display: none;">
            🔄 Ambill Antrian Baru 
        </button>
    </div>
</div>

<!-- SIDEBAR / PANEL SAMPING ANTREAN -->
<div id="modalAntrean" class="sidebar-overlay hidden" onclick="window.tutupModalAntrean()">
    <div class="sidebar-card">
        <div class="sidebar-header">
            <h3>Urutan Antrean MBG</h3>
            <button type="button" class="btn-close" onclick="window.tutupModalAntrean(); event.stopPropagation();">&times;</button>
        </div>
        <div class="sidebar-body" onclick="event.stopPropagation()">
            <table class="antrean-table">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Kelas</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabelAntreanBody">
                    <tr><td colspan="3" style="text-align:center;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBl-m0uLNkWyFFQAd9ho7yYTcsX6z9KIMk",
        authDomain: "mbg-pkk.firebaseapp.com",
        databaseURL: "https://mbg-pkk-default-rtdb.firebaseio.com",
        projectId: "mbg-pkk",
        storageBucket: "mbg-pkk.firebasestorage.app",
        messagingSenderId: "752541102453",
        appId: "1:752541102453:web:38047f08514042a137233c",
        measurementId: "G-JFCTHZZDRQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let daftarAntreanGlobal = [];
    let myKelasGlobal = "";

    window.bukaModalAntrean = function() {
        const modal = document.getElementById("modalAntrean");
        if (modal) {
            renderTabelAntrean();
            modal.classList.remove("hidden");
        } else {
            console.error("Elemen #modalAntrean tidak ditemukan di HTML!");
        }
    };

    window.tutupModalAntrean = function() {
        const modal = document.getElementById("modalAntrean");
        if (modal) modal.classList.add("hidden");
    };

    // 1. Cek status antrean saat halaman dimuat
    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('myAntreanKey');
        const savedKelas = localStorage.getItem('myKelas');

        if (savedKey && savedKelas) {
            myKelasGlobal = savedKelas;
            tampilkanStatusBox(savedKelas);
            pantauStatus(savedKey);
        }

        pantauSeluruhAntrean();
    });

    // 2. FUNGSI AMBIL ANTREAN (Dipasang ke window agar onclick HTML bisa panggil)
    window.ambilAntrean = function() {
        const kelasSelect = document.getElementById("kelas");
        const kelas = kelasSelect ? kelasSelect.value : "";

        if (!kelas) {
            alert("Pilih kelas terlebih dahulu!");
            return;
        }

        myKelasGlobal = kelas;
        const antreanRef = ref(db, 'antrean');

        // Simpan data ke Firebase
        const newAntreanRef = push(antreanRef, {
            kelas: kelas,
            status: "menunggu",
            waktu: Date.now()
        });

        const newKey = newAntreanRef.key;

        // Simpan key & kelas ke LocalStorage
        localStorage.setItem('myAntreanKey', newKey);
        localStorage.setItem('myKelas', kelas);

        tampilkanStatusBox(kelas);
        pantauStatus(newKey);
    };

    // 3. FUNGSI RESET ANTREAN (Dipasang ke window agar onclick HTML bisa panggil)
    window.resetAntrean = function() {
        localStorage.removeItem('myAntreanKey');
        localStorage.removeItem('myKelas');
        
        // Reload halaman agar kembali bersih ke form awal
        window.location.reload();
    };

    // Helper Tampilan
    function tampilkanStatusBox(kelas) {
        document.getElementById("formSection").style.display = "none";
        document.getElementById("statusBox").style.display = "block";
        document.getElementById("namaKelasLabel").innerText = kelas;
    }

    // 4. Pantau Status Antrean secara Real-Time
    function pantauStatus(key) {
    const spesifikRef = ref(db, 'antrean/' + key);

    onValue(spesifikRef, (snapshot) => {
        const data = snapshot.val();
        
        if (!data) {
            window.resetAntrean();
            return;
        }

        const box = document.getElementById("statusBox");
        const text = document.getElementById("statusAntreanText");
        const instruksi = document.getElementById("instruksiText");
        const btnReset = document.getElementById("btnReset");

        if (data.status === 'menunggu') {
            box.className = "status-box status-menunggu";
            text.innerText = "MENUNGGU...";
            instruksi.innerText = "Harap tunggu di kelas sampai giliran dipanggil.";
            if (btnReset) btnReset.style.display = "none";
        } else if (data.status === 'dipanggil') {
            box.className = "status-box status-dipanggil";
            text.innerText = "SILAKAN AMBIL!";
            instruksi.innerText = "🚨 Giliran kelasmu! Segera menuju tempat pembagian MBG.";
            if (btnReset) btnReset.style.display = "none";
        } else if (data.status === 'selesai') {
            box.className = "status-box status-selesai";
            text.innerText = "SELESAI";
            instruksi.innerText = "Makanan sudah diambil. Terima kasih!";
            
            // Tampilkan tombol reset bawaan HTML
            if (btnReset) btnReset.style.display = "block";
        }
    });
}

    // Fungsi membuat tombol "Ambil Antrean Baru"
    function buatTombolReset() {
        if (!document.getElementById("btnReset")) {
            const box = document.getElementById("statusBox");
            const btn = document.createElement("button");
            btn.id = "btnReset";
            btn.innerText = "🔄 Ambil Antrean Baru / Berikutnya";
            btn.style.cssText = "margin-top: 15px; background-color: #2563eb; color: white; border: none; padding: 12px 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 14px;";
            
            // Pasang fungsi reset langsung ke Event Listener
            btn.addEventListener('click', () => {
                window.resetAntrean();
            });

            box.appendChild(btn);
        }
    }

    function hapusTombolReset() {
        const btn = document.getElementById("btnReset");
        if (btn) btn.remove();
    }

    function pantauSeluruhAntrean() {
        const antreanRef = ref(db, 'antrean');
        onValue(antreanRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                daftarAntreanGlobal = Object.keys(data).map(key => ({
                    key: key,
                    ...data[key]
                })).sort((a, b) => a.waktu - b.waktu);

                const modal = document.getElementById("modalAntrean");
                if (modal && !modal.classList.contains("hidden")) {
                    renderTabelAntrean();
                }
            } else {
                daftarAntreanGlobal = [];
                renderTabelAntrean();
            }
        });
    }

    

    function renderTabelAntrean(){
        const tbody = document.getElementById("tabelAntreanBody");
        if (!tbody) return;
            
        tbody.innerHTML = "";

        // Perbaikan logika: jika array kosong
        if (daftarAntreanGlobal.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#64748b;">Belum ada antrean hari ini</td></tr>';
            return;
        }

        // Perbaikan variabel index, isMyClass, dan "dipanggil"
        daftarAntreanGlobal.forEach((item, index) => {
            const tr = document.createElement("tr");

            const isMyClass = (item.kelas === myKelasGlobal);
            if (isMyClass) tr.classList.add("my-class-row");
            
            let badgeClass = "badge-menunggu";
            if (item.status === "selesai") badgeClass = "badge-selesai";
            if (item.status === "dipanggil") badgeClass = "badge-dipanggil";

            tr.innerHTML = `
                <td>#${index + 1}</td>
                <td><strong>${item.kelas} ${isMyClass ? '⭐ (Kelas Anda)' : ''}</strong></td>
                <td><span class="badge ${badgeClass}">${item.status || 'menunggu'}</span></td>
            `;

            tbody.appendChild(tr);
        });
        
    }
</script>

</body>
</html>
