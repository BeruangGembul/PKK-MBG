<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrean MBG - Login</title>
    <link rel="stylesheet" href="mstyle.css">
</head>
<body>

<div class="card">
    
    <h2>Sistem Antrean MBG</h2>
    <p class="subtitle">Pilih peran kamu untuk masuk ke aplikasi</p>

    <!-- Tombol Pilihan Tab Role -->
    <div class="role-container">
        <button id="btnRoleKm" class="btn-tab btn-tab-active" onclick="pilihRole('km')">
            Ketua Murid
        </button>
        <button id="btnRolePetugas" class="btn-tab btn-tab-inactive" onclick="pilihRole('petugas')">
            Petugas MBG
        </button>
    </div>

    <!-- Form KM -->
    <div id="formKm">
        <p class="info-text">Akses langsung untuk mengambil nomor antrean makanan kelas kamu.</p>
        <button class="btn-action btn-km" onclick="masukSebagaiKM()">
            Masuk ke Halaman KM &rarr;
        </button>
    </div>

    <!-- Form Petugas -->
    <div id="formPetugas" style="display: none;">
        <div class="form-group-left">
            <label for="passPetugas" class="label-login">Password PIN Petugas:</label>
            <input type="password" id="passPetugas" placeholder="Masukkan PIN Petugas">
        </div>
        
        <p id="pesanError" class="error-message">⚠️ PIN Salah! Silakan coba lagi.</p>
        
        <button class="btn-action" onclick="masukSebagaiPetugas()">
            Masuk Halaman Petugas
        </button>
    </div>
</div>

<script>
    let currentRole = 'km';

    
    


    function pilihRole(role) {
        currentRole = role;
        const btnKm = document.getElementById('btnRoleKm');
        const btnPetugas = document.getElementById('btnRolePetugas');
        const formKm = document.getElementById('formKm');
        const formPetugas = document.getElementById('formPetugas');
        const pesanError = document.getElementById('pesanError');

        pesanError.style.display = 'none';

        if (role === 'km') {
            btnKm.className = 'btn-tab btn-tab-active';
            btnPetugas.className = 'btn-tab btn-tab-inactive';
            formKm.style.display = 'block';
            formPetugas.style.display = 'none';
        } else {
            btnPetugas.className = 'btn-tab btn-tab-active';
            btnKm.className = 'btn-tab btn-tab-inactive';
            formPetugas.style.display = 'block';
            formKm.style.display = 'none';
        }
    }

    function masukSebagaiKM() {
        window.location.href = "km.html";
    }

    function masukSebagaiPetugas() {
        const pin = document.getElementById('passPetugas').value;
        const pesanError = document.getElementById('pesanError');

        // PIN Default Petugas adalah 123456
        if (pin === "123456") {
            window.location.href = "petugas.html";
        } else {
            pesanError.style.display = 'block';
        }
    }
</script>

</body>
</html>
